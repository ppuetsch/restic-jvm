[versions]
# restic shipped in the restic-jvm-binary-* artifacts; CI tests the library against it
restic-bundled = "0.19.1"
kotlin = "2.4.21"
ktlint-gradle = "14.2.0"
ktlint-engine = "1.8.0"
dokka = "2.2.0"
detekt = "2.0.0-alpha.6"
dependency-check = "13.0.0"
sonarqube = "7.5.0.8588"
jacoco = "0.8.16"
jackson = "3.2.4"
junit = "6.1.3"
gradle-pitest = "1.19.0"
pitest-core = "1.30.1"
pitest-junit5 = "1.2.3"
cyclonedx = "3.5.1"
# Untergrenzen für Abhängigkeiten der Build-Werkzeuge (Dokka, ktlint, Kotlin-Plugin), deren gesperrte Versionen
# bekannte Schwachstellen haben; scripts/vulnerable_locks.py findet die nächsten Kandidaten.
floor-jackson2 = "2.22.4"
floor-guava = "33.7.2-jre"
floor-jsoup = "1.23.2"
floor-freemarker = "2.3.35"
floor-logback = "1.5.38"
floor-bouncycastle = "1.86"

[libraries]
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
floor-jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "floor-jackson2" }
floor-guava = { module = "com.google.guava:guava", version.ref = "floor-guava" }
floor-jsoup = { module = "org.jsoup:jsoup", version.ref = "floor-jsoup" }
floor-freemarker = { module = "org.freemarker:freemarker", version.ref = "floor-freemarker" }
floor-logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "floor-logback" }
floor-logback-core = { module = "ch.qos.logback:logback-core", version.ref = "floor-logback" }
floor-bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "floor-bouncycastle" }
floor-bouncycastle-pg = { module = "org.bouncycastle:bcpg-jdk18on", version.ref = "floor-bouncycastle" }
floor-bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "floor-bouncycastle" }
floor-bouncycastle-util = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "floor-bouncycastle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependency-check" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
pitest = { id = "info.solidsoft.pitest", version.ref = "gradle-pitest" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
