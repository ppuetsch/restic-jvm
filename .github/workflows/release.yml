name: Release

on:
  push:
    tags: ["v*"]

env:
  RESTIC_VERSION: "0.19.1"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install FUSE for mount tests
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: Install restic
        shell: bash
        run: |
          scripts/install-restic.sh "$RESTIC_VERSION" "$RUNNER_TEMP/restic-bin"
          echo "RESTIC_BINARY=$RUNNER_TEMP/restic-bin/restic" >> "$GITHUB_ENV"
      - name: Verify tag matches project version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(./gradlew -q printVersion --no-daemon)"
          if [ "$expected" != "$actual" ]; then echo "tag $expected != project version $actual" >&2; exit 1; fi
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Publish to GitHub Packages
        run: ./gradlew publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
