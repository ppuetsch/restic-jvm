name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RESTIC_VERSION: "0.19.1"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install FUSE for mount tests
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: Install restic
        shell: bash
        run: |
          scripts/install-restic.sh "$RESTIC_VERSION" "$RUNNER_TEMP/restic-bin"
          echo "RESTIC_BINARY=$RUNNER_TEMP/restic-bin/restic" >> "$GITHUB_ENV"
      - name: Verify tag matches project version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(./gradlew -q printVersion --no-daemon)"
          if [ "$expected" != "$actual" ]; then echo "tag $expected != project version $actual" >&2; exit 1; fi
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Software bill of materials
        run: ./gradlew cyclonedxDirectBom --no-daemon
      - name: Sign and publish to GitHub Packages
        run: ./gradlew publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - name: Check that every jar is signed
        shell: bash
        run: |
          for jar in build/libs/*.jar; do
            test -f "$jar.asc" || { echo "missing signature for $jar" >&2; exit 1; }
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/libs/*.jar
            build/reports/sbom/*.cdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar build/libs/*.asc build/reports/sbom/*.cdx.json signing-key.asc \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
