name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # wöchentlich, damit neu veröffentlichte Schwachstellen auch ohne Commit auffallen
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-and-e2e (${{ matrix.os }}, restic ${{ matrix.restic }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        restic: ["0.18.1", "0.19.1"]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      IS_ANALYSIS_LEG: ${{ matrix.os == 'ubuntu-latest' && matrix.restic == '0.19.1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install FUSE for mount tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: Install restic
        shell: bash
        run: |
          scripts/install-restic.sh "${{ matrix.restic }}" "$RUNNER_TEMP/restic-bin"
          echo "RESTIC_BINARY=$RUNNER_TEMP/restic-bin/restic" >> "$GITHUB_ENV"
      - name: Build, ktlint, detekt (type resolution), tests and coverage
        shell: bash
        run: ./gradlew build --no-daemon
      - name: Upload detekt main findings to code scanning
        if: always() && env.IS_ANALYSIS_LEG == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/main.sarif
          category: detekt-main
      - name: Upload detekt test findings to code scanning
        if: always() && env.IS_ANALYSIS_LEG == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/test.sarif
          category: detekt-test
      - name: SonarCloud analysis
        if: env.IS_ANALYSIS_LEG == 'true' && env.SONAR_TOKEN != ''
        run: ./gradlew sonar --no-daemon
      - name: SonarCloud skipped
        if: env.IS_ANALYSIS_LEG == 'true' && env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN secret is not set, SonarCloud analysis skipped"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-${{ matrix.os }}-${{ matrix.restic }}
          path: |
            build/reports/tests
            build/reports/detekt
            build/reports/jacoco

  dependency-check:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore vulnerability database
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Dependency check skipped
        if: env.NVD_API_KEY == ''
        run: echo "::warning::NVD_API_KEY secret is not set, OWASP dependency check skipped (free key at https://nvd.nist.gov/developers/request-an-api-key)"
      - name: Scan runtime dependencies (fails on CVSS >= 7)
        if: env.NVD_API_KEY != ''
        run: ./gradlew dependencyCheckAnalyze --no-daemon
      - name: Upload findings to code scanning
        if: always() && hashFiles('build/reports/dependency-check-report.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/dependency-check-report.sarif
          category: dependency-check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
